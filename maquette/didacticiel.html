<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maquette — didacticiel BOUSE</title>
    <!--
      MAQUETTE, pas le produit. Cette page affiche la vraie appli (serveur de
      développement) dans un cadre et pose par-dessus la visite guidée et la
      carte « Tes premiers pas ». Rien ici n'est livré : `npm run build` ne
      prend que index.html. Ouvrir : http://localhost:5173/maquette/didacticiel.html
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #050506;
        color: #f3f2ee;
        font: 14px/1.4 Inter, system-ui, sans-serif;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
        padding: 10px 14px;
        border-bottom: 1px solid rgb(255 255 255 / 0.1);
        background: #0d0d0f;
      }
      .bar strong {
        font-weight: 550;
        margin-right: 6px;
      }
      .bar small {
        flex-basis: 100%;
        color: #85858b;
        font-size: 12px;
      }
      .bar button {
        min-height: 32px;
        padding: 0 12px;
        border: 1px solid rgb(255 255 255 / 0.16);
        border-radius: 8px;
        background: #1a1a1e;
        color: #f3f2ee;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        transition:
          background-color 140ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 140ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .bar button:hover {
        background: #252528;
      }
      .bar button:active {
        transform: scale(0.97);
      }
      .bar button[aria-pressed="true"] {
        background: #f3f2ee;
        color: #171719;
        border-color: transparent;
      }
      .bar .gap {
        flex: 1;
      }
      .stage {
        display: grid;
        place-items: center;
        min-height: 0;
        overflow: hidden;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0b;
      }
      .stage[data-device="phone"] iframe {
        width: 390px;
        height: min(780px, calc(100% - 24px));
        border: 1px solid rgb(255 255 255 / 0.16);
        border-radius: 28px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <strong>Maquette · didacticiel</strong>
      <button id="replay">▶ Rejouer la visite</button>
      <button id="tick">Cocher un pas</button>
      <button id="reset">Remettre à zéro</button>
      <span class="gap"></span>
      <button id="desktop" aria-pressed="true">Ordinateur</button>
      <button id="phone" aria-pressed="false">Téléphone</button>
      <small
        >Maquette posée sur la vraie appli. Dans la vraie version, les pas se
        cochent tout seuls ; ici, « Cocher un pas » fait semblant.</small
      >
    </div>
    <div class="stage" data-device="desktop"><iframe id="app" title="BOUSE"></iframe></div>

    <script>
      const frame = document.getElementById("app");
      const stage = document.querySelector(".stage");
      // L'ouverture animée a déjà sa propre démonstration : on la saute ici.
      try {
        sessionStorage.setItem("bouse.splash.seen", "1");
      } catch {}
      frame.src = "/#home";

      const CSS = `
:root{--mq-io:cubic-bezier(0.65,0,0.35,1);--mq-out:cubic-bezier(0.22,1,0.36,1);--mq-settle:cubic-bezier(0.34,1.4,0.5,1)}
/* Sur l'accueil, « Tes premiers pas » remplace la phrase d'aide tant qu'ils ne sont pas finis. */
.page-view > .page-guide, .page-view > .page-guide-show{display:none}

/* ---------- Visite guidée ---------- */
.tour{position:fixed;inset:0;z-index:90;pointer-events:none}
.tour[data-on]{pointer-events:auto}
.tour-block{position:fixed;inset:0}
.tour-hole{position:fixed;left:0;top:0;pointer-events:none;border-radius:14px;
  box-shadow:0 0 0 1px rgb(var(--accent-violet-rgb)/.78),0 0 0 6px rgb(var(--accent-violet-rgb)/.11),0 0 0 200vmax rgb(4 4 6/.78);
  transition:left 480ms var(--mq-io),top 480ms var(--mq-io),width 480ms var(--mq-io),height 480ms var(--mq-io),border-radius 480ms var(--mq-io),box-shadow 360ms var(--mq-out)}
.tour-hole[data-open]{border-radius:0;box-shadow:0 0 0 1px transparent,0 0 0 6px transparent,0 0 0 200vmax rgb(4 4 6/0)}
.tour-hole[data-blank]{box-shadow:0 0 0 1px transparent,0 0 0 6px transparent,0 0 0 200vmax rgb(4 4 6/.78)}
.tour-card{position:fixed;left:0;top:0;box-sizing:border-box;width:min(340px,calc(100vw - 24px));padding:18px 18px 14px;
  border:1px solid var(--line-strong);border-radius:14px;
  background:linear-gradient(180deg,rgb(255 255 255/.04),transparent 42%),var(--raised);
  box-shadow:var(--highlight-edge),0 28px 70px rgb(0 0 0/.62);color:var(--text-secondary);
  opacity:0;transform:translate3d(var(--x,0px),calc(var(--y,0px) + 10px),0) scale(.98);transform-origin:50% 0;
  transition:opacity 150ms var(--mq-out),transform 150ms var(--mq-out)}
.tour-card[data-in]{opacity:1;transform:translate3d(var(--x,0px),var(--y,0px),0) scale(1);
  transition:opacity 260ms var(--mq-out),transform 420ms var(--mq-settle)}
.tour-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.tour-dots{display:flex;gap:5px}
.tour-dots i{display:block;width:6px;height:6px;border-radius:3px;background:var(--ink-faint);
  transition:width 320ms var(--mq-settle),background-color 240ms var(--mq-out)}
.tour-dots i[data-s=done]{background:var(--text-secondary)}
.tour-dots i[data-s=now]{width:20px;background:var(--accent-violet)}
.tour-count{color:var(--text-tertiary);font-size:var(--type-caption);font-variant-numeric:tabular-nums}
.tour-title{margin:0 0 6px;color:var(--text);font:550 1.125rem/1.3 var(--font-display);letter-spacing:-0.012em}
.tour-text{margin:0;font-size:var(--type-body-sm);line-height:1.55}
.tour-demo{margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-low)}
.tour-demo-line{margin:0;color:var(--text);font-size:var(--type-body);line-height:1.6}
.tour-def{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:var(--type-body-sm);line-height:1.55;
  animation:tour-def-in 320ms var(--mq-out) both}
.tour-def strong{display:block;color:var(--text);font-weight:550;margin-bottom:2px}
.tour-hint{display:flex;align-items:center;gap:8px;margin:12px 0 0;color:var(--text-tertiary);font-size:var(--type-caption)}
.tour-hint::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-violet);animation:tour-beat 1.8s var(--mq-io) infinite}
.tour-hint[data-ok]{color:var(--text-secondary)}
.tour-hint[data-ok]::before{animation:none;opacity:.5}
.tour-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.tour-skip{min-height:40px;padding:0 4px;border:0;background:none;color:var(--text-tertiary);font:inherit;font-size:var(--type-body-sm);cursor:pointer;
  transition:color 140ms var(--mq-out)}
.tour-skip:hover{color:var(--text)}
.tour-next{min-height:40px;padding:0 18px;border:0;border-radius:999px;background:var(--text);color:var(--text-inverse);
  font:550 var(--type-body-sm)/1 var(--font-sans);cursor:pointer;
  box-shadow:inset 0 1px 0 rgb(255 255 255/.7),0 6px 18px rgb(0 0 0/.35);
  transition:transform 160ms var(--mq-out),background-color 160ms var(--mq-out)}
.tour-next:hover{background:#fff}
.tour-next:active{transform:scale(.97)}
.tour-next:focus-visible,.tour-skip:focus-visible{outline:2px solid rgb(var(--accent-violet-rgb)/.8);outline-offset:3px}
@keyframes tour-def-in{from{opacity:0;transform:translateY(-4px)}}
@keyframes tour-beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:.35}}

/* ---------- Tes premiers pas ---------- */
.first-steps{position:relative;z-index:1;box-sizing:border-box;margin:0 0 var(--space-6);padding:var(--space-4) var(--space-5) var(--space-4);
  border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;
  background:linear-gradient(90deg,rgb(var(--accent-violet-rgb)/calc(.07*var(--wash-k))),transparent 48%),var(--raised);
  box-shadow:var(--highlight-edge)}
.first-steps[data-hello]{animation:fs-hello 1500ms var(--mq-out) both}
.fs-head{display:flex;align-items:baseline;gap:var(--space-3)}
.fs-title{margin:0;color:var(--text);font:550 var(--type-body-lg)/1.3 var(--font-display);letter-spacing:-0.01em}
.fs-sub{margin:0;color:var(--text-tertiary);font-size:var(--type-small)}
.fs-count{margin-left:auto;color:var(--text-tertiary);font-size:var(--type-small);font-variant-numeric:tabular-nums;white-space:nowrap}
.fs-count b{color:var(--text);font-weight:550}
.fs-hide{align-self:center;display:grid;place-items:center;width:32px;height:32px;margin:-6px -10px -6px 0;padding:0;border:0;border-radius:var(--radius-sm);
  background:transparent;color:var(--text-tertiary);font-size:18px;line-height:1;cursor:pointer;transition:color 140ms var(--mq-out),background-color 140ms var(--mq-out)}
.fs-hide:hover{color:var(--text);background:rgb(255 255 255/.06)}
.fs-path{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:var(--space-5) 0 0;padding:0;list-style:none}
.fs-path::before,.fs-path::after{content:"";position:absolute;left:10%;right:10%;top:13px;height:1px;background:var(--line-strong)}
.fs-path::after{height:2px;top:12.5px;background:var(--accent-violet);transform-origin:0 50%;transform:scaleX(var(--line,0));
  transition:transform 620ms var(--mq-io)}
.fs-path li{position:relative;z-index:1;display:grid;justify-items:center;gap:8px;text-align:center}
.fs-node{position:relative;display:grid;place-items:center;width:27px;height:27px;border:1px solid var(--line-strong);border-radius:50%;
  background:var(--surface);color:var(--text-tertiary);font:500 12px/1 var(--font-sans);font-variant-numeric:tabular-nums;
  transition:border-color 260ms var(--mq-out),background-color 260ms var(--mq-out),color 260ms var(--mq-out)}
.fs-node em{font-style:normal;transition:opacity 160ms var(--mq-out)}
.fs-node svg{position:absolute;width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset 340ms var(--mq-out) 140ms}
.fs-label{color:var(--text-tertiary);font-size:var(--type-caption);line-height:1.3;transition:color 260ms var(--mq-out)}
li[data-s=now] .fs-node{border-color:var(--text);background:var(--surface-selected);color:var(--text)}
li[data-s=now] .fs-node::after{content:"";position:absolute;inset:-5px;border:1px solid rgb(255 255 255/.4);border-radius:50%;animation:fs-breathe 2.6s var(--mq-io) infinite}
li[data-s=now] .fs-label{color:var(--text)}
li[data-s=done] .fs-node{border-color:rgb(var(--accent-violet-rgb)/.75);background:rgb(var(--accent-violet-deep));color:rgb(var(--accent-violet-ink))}
li[data-s=done][data-just] .fs-node{animation:fs-pop 460ms var(--mq-settle)}
li[data-s=done] .fs-node em{opacity:0}
li[data-s=done] .fs-node svg{stroke-dashoffset:0}
li[data-s=done] .fs-label{color:var(--text-secondary)}
.fs-now{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:var(--space-4) 0 0;padding-top:var(--space-3);border-top:1px solid var(--line);
  color:var(--text-secondary);font-size:var(--type-body-sm);line-height:1.5}
.fs-now[data-swap]{animation:fs-swap 380ms var(--mq-out) both}
.fs-now span{color:var(--text-tertiary);font-size:var(--type-caption);letter-spacing:.06em;text-transform:uppercase}
.fs-go{margin-left:auto;min-height:32px;padding:0 4px;border:0;background:none;color:var(--text);font:500 var(--type-body-sm)/1 var(--font-sans);cursor:pointer;white-space:nowrap}
.fs-go i{display:inline-block;font-style:normal;transition:transform 200ms var(--mq-out)}
.fs-go:hover i{transform:translateX(3px)}
@keyframes fs-breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.22);opacity:0}}
@keyframes fs-pop{0%{transform:scale(.8)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes fs-swap{from{opacity:0;transform:translateY(4px)}}
@keyframes fs-hello{0%{box-shadow:var(--highlight-edge),0 0 0 1px rgb(var(--accent-violet-rgb)/.8),0 0 0 8px rgb(var(--accent-violet-rgb)/.14)}100%{box-shadow:var(--highlight-edge),0 0 0 1px rgb(var(--accent-violet-rgb)/0),0 0 0 18px rgb(var(--accent-violet-rgb)/0)}}
@media (max-width:560px){
  .first-steps{padding:var(--space-4)}
  .fs-head{flex-wrap:wrap}
  .fs-sub{order:3;flex-basis:100%}
  .fs-go{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  .tour-hole,.tour-card,.tour-card[data-in],.fs-path::after,.fs-node,.fs-node svg{transition-duration:1ms}
  .tour-hint::before,li[data-s=now] .fs-node::after,li[data-s=done][data-just] .fs-node,.first-steps[data-hello],.fs-now[data-swap],.tour-def{animation:none}
}`;

      const STEPS = [
        {
          target: (q) => q(".sidebar nav") || q(".mobile-bottom-nav"),
          title: "Tes espaces",
          text: (phone) =>
            phone
              ? "Tout est rangé ici, en bas de l’écran : apprendre, réviser, tes projets."
              : "Tout est rangé ici. Pour débuter, deux suffisent : Vue d’ensemble et Académie.",
        },
        {
          target: (q) => q(".console-hero"),
          title: "Commence ici",
          text: () =>
            "BOUSE te propose toujours ta prochaine leçon. Un seul geste : le bouton blanc.",
        },
        {
          target: () => null,
          demo: true,
          title: "Un mot que tu ne connais pas ?",
          text: () =>
            "Dans les leçons, les mots difficiles sont soulignés. Touche-en un : sa définition s’ouvre.",
        },
        {
          target: (q) =>
            q('.sidebar a[href="#reviews"]') ||
            q('.mobile-bottom-nav a[href="#reviews"]'),
          title: "Pour ne rien oublier",
          text: () =>
            "Après une leçon, BOUSE te repose quelques questions, au bon moment. Ça se passe ici.",
        },
        {
          target: (q) => q(".search-trigger") || q(".topbar-search"),
          title: "Tu cherches quelque chose ?",
          text: () =>
            "Tape un mot : une leçon, une définition, un outil. BOUSE te l’ouvre.",
        },
      ];

      const PAS = [
        ["Première leçon", "Ouvre ta première leçon : c’est le bouton blanc, juste en dessous."],
        ["Mot souligné", "Dans la leçon, touche un mot souligné pour voir sa définition."],
        ["Quiz réussi", "Va au bout de la leçon et réussis son quiz."],
        ["Révision", "Fais ta première révision, dans l’espace Révisions."],
        ["Premier projet", "Crée ton premier projet : une idée à toi, dans Projets."],
      ];

      let W, D, tour, hole, card, steps, index = -1, done = 0, timer = 0, hiddenByUser = false;

      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const frameTick = () => new Promise((r) => W.requestAnimationFrame(() => r()));

      // Premier élément réellement visible dans la fenêtre de l'appli.
      function q(selector) {
        for (const el of D.querySelectorAll(selector)) {
          const r = el.getBoundingClientRect();
          if (r.width > 4 && r.height > 4 && r.right > 0 && r.left < W.innerWidth && r.bottom > 0 && r.top < W.innerHeight) return el;
        }
        return null;
      }

      function build() {
        W = frame.contentWindow;
        D = frame.contentDocument;
        if (!D.getElementById("mq-style")) {
          const style = D.createElement("style");
          style.id = "mq-style";
          style.textContent = CSS;
          D.head.append(style);
        }
        D.querySelector(".tour")?.remove();
        tour = D.createElement("div");
        tour.className = "tour";
        tour.innerHTML = `
          <div class="tour-block"></div>
          <div class="tour-hole" data-open></div>
          <section class="tour-card" role="dialog" aria-modal="true" aria-label="Visite guidée">
            <div class="tour-top"><span class="tour-dots">${"<i></i>".repeat(STEPS.length)}</span><span class="tour-count"></span></div>
            <p class="tour-title"></p>
            <p class="tour-text"></p>
            <div class="tour-demo" hidden>
              <p class="tour-demo-line">« Un <button type="button" class="glossary-inline-term">ETF</button> est un panier d’actions qu’on achète en une seule fois. »</p>
              <p class="tour-def" hidden><strong>ETF</strong>Un panier tout prêt qui contient des centaines d’actions. Tu achètes le panier, pas chaque action une par une.</p>
              <p class="tour-hint">Essaie : touche le mot souligné.</p>
            </div>
            <div class="tour-actions"><button type="button" class="tour-skip">Passer</button><button type="button" class="tour-next">Suivant</button></div>
          </section>`;
        D.body.append(tour);
        hole = tour.querySelector(".tour-hole");
        card = tour.querySelector(".tour-card");
        tour.querySelector(".tour-next").onclick = () => go(index + 1);
        tour.querySelector(".tour-skip").onclick = () => finish();
        tour.querySelector(".glossary-inline-term").onclick = () => {
          tour.querySelector(".tour-def").hidden = false;
          const hint = tour.querySelector(".tour-hint");
          hint.dataset.ok = "";
          hint.textContent = "Voilà. Ça marche pareil dans toutes les leçons.";
          place();
        };
        W.addEventListener("resize", () => {
          if (index >= 0) place();
        });
        D.addEventListener("keydown", (event) => {
          if (index < 0) return;
          if (event.key === "Escape") finish();
          if (event.key === "ArrowRight") go(index + 1);
        });
      }

      // Le menu déborde un peu de sa boîte (libellés longs) : on entoure aussi ses liens.
      function unionRect(el) {
        const r = el.getBoundingClientRect();
        const box = { left: r.left, top: r.top, right: r.right, bottom: r.bottom };
        if (el.matches("nav"))
          for (const link of el.querySelectorAll("a, button")) {
            const l = link.getBoundingClientRect();
            if (!l.width) continue;
            box.left = Math.min(box.left, l.left);
            box.right = Math.max(box.right, l.right);
            box.top = Math.min(box.top, l.top);
            box.bottom = Math.max(box.bottom, l.bottom);
          }
        return box;
      }

      function holeRect(rect) {
        Object.assign(hole.style, {
          left: `${rect.x}px`,
          top: `${rect.y}px`,
          width: `${rect.w}px`,
          height: `${rect.h}px`,
        });
      }

      // Pose le trou de lumière sur la cible et la bulle à côté, sans sortir de l'écran.
      function place() {
        const step = STEPS[index];
        const vw = W.innerWidth, vh = W.innerHeight, m = 12;
        const target = step.target(q);
        const cw = card.offsetWidth, ch = card.offsetHeight;
        let x, y;
        if (!target) {
          hole.dataset.blank = "";
          holeRect({ x: vw / 2, y: vh / 2, w: 0, h: 0 });
          x = (vw - cw) / 2;
          y = Math.max(m, (vh - ch) / 2 - 20);
        } else {
          delete hole.dataset.blank;
          const r = unionRect(target);
          const pad = 6;
          const t = {
            x: Math.max(4, r.left - pad),
            y: Math.max(4, r.top - pad),
          };
          t.w = Math.min(vw - 4, r.right + pad) - t.x;
          t.h = Math.min(vh - 4, r.bottom + pad) - t.y;
          holeRect(t);
          const gap = 16;
          if (t.x + t.w + gap + cw <= vw - m && t.h > t.w) {
            x = t.x + t.w + gap; // à droite d'une cible haute (le menu)
            y = Math.min(Math.max(m, t.y + Math.min(40, t.h / 4)), vh - ch - m);
            if (t.h < 120) y = Math.min(Math.max(m, t.y + t.h / 2 - 56), vh - ch - m);
          } else {
            x = Math.min(Math.max(m, t.x + t.w / 2 - cw / 2), vw - cw - m);
            if (t.y + t.h + gap + ch <= vh - m) y = t.y + t.h + gap;
            else if (t.y - gap - ch >= m) y = t.y - gap - ch;
            else y = vh - ch - m - (q(".mobile-bottom-nav") ? 76 : 0);
          }
        }
        card.style.setProperty("--x", `${Math.round(x)}px`);
        card.style.setProperty("--y", `${Math.round(y)}px`);
      }

      async function go(next) {
        if (next >= STEPS.length) return finish();
        const first = index < 0;
        index = next;
        const step = STEPS[index];
        const phone = W.innerWidth < 720;
        if (!first) {
          delete card.dataset.in;
          await wait(150);
        }
        tour.querySelectorAll(".tour-dots i").forEach((dot, i) => {
          dot.dataset.s = i < index ? "done" : i === index ? "now" : "todo";
        });
        tour.querySelector(".tour-count").textContent = `${index + 1} sur ${STEPS.length}`;
        tour.querySelector(".tour-title").textContent = step.title;
        tour.querySelector(".tour-text").textContent = step.text(phone);
        tour.querySelector(".tour-demo").hidden = !step.demo;
        tour.querySelector(".tour-next").textContent =
          index === STEPS.length - 1 ? "C’est parti" : "Suivant";
        card.style.transition = "none";
        place();
        void card.offsetWidth;
        card.style.transition = "";
        await wait(first ? 260 : 200); // la lumière glisse d'abord, la bulle arrive ensuite
        if (index === next) {
          card.dataset.in = "";
        }
      }

      async function startTour() {
        W.scrollTo(0, 0);
        build();
        steps = ensureSteps();
        index = -1;
        holeRect({ x: 0, y: 0, w: W.innerWidth, h: W.innerHeight });
        hole.dataset.open = "";
        tour.dataset.on = "";
        await frameTick();
        await frameTick();
        delete hole.dataset.open;
        go(0);
      }

      async function finish() {
        if (index < 0) return;
        index = -1;
        delete card.dataset.in;
        delete hole.dataset.blank;
        hole.dataset.open = "";
        // La lumière se rouvre sur toute la page, puis « Tes premiers pas » prend le relais.
        const s = ensureSteps();
        const r = s?.getBoundingClientRect();
        if (r) holeRect({ x: r.left, y: r.top, w: r.width, h: r.height });
        await wait(40);
        holeRect({ x: 0, y: 0, w: W.innerWidth, h: W.innerHeight });
        await wait(420);
        delete tour.dataset.on;
        tour.remove();
        if (s) {
          s.removeAttribute("data-hello");
          void s.offsetWidth;
          s.dataset.hello = "";
        }
      }

      function ensureSteps() {
        let s = D.querySelector(".first-steps");
        const home = D.querySelector(".learning-home");
        if (!home) return s;
        if (!s) {
          s = D.createElement("section");
          s.className = "first-steps";
          s.setAttribute("aria-label", "Tes premiers pas");
          s.innerHTML = `
            <header class="fs-head">
              <h2 class="fs-title">Tes premiers pas</h2>
              <p class="fs-sub">Ils se cochent tout seuls, quand tu les fais.</p>
              <span class="fs-count"><b>0</b> sur ${PAS.length}</span>
              <button type="button" class="fs-hide" aria-label="Masquer les premiers pas">×</button>
            </header>
            <ol class="fs-path">${PAS.map(
              ([label], i) =>
                `<li><span class="fs-node"><em>${i + 1}</em><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg></span><span class="fs-label">${label}</span></li>`,
            ).join("")}</ol>
            <p class="fs-now"></p>`;
          s.querySelector(".fs-hide").onclick = () => {
            hiddenByUser = true;
            fold(s);
          };
          s.querySelector(".fs-now").addEventListener("click", (event) => {
            if (event.target.closest(".fs-go")) tick();
          });
        }
        const stageEl = home.querySelector(".learning-stage");
        if (s.parentNode !== home) home.insertBefore(s, stageEl);
        paint(s, false);
        return s;
      }

      function paint(s, animate) {
        s.querySelectorAll(".fs-path li").forEach((li, i) => {
          const state = i < done ? "done" : i === done ? "now" : "todo";
          if (animate && state === "done" && li.dataset.s !== "done") li.dataset.just = "";
          li.dataset.s = state;
        });
        s.querySelector(".fs-path").style.setProperty("--line", String(Math.min(done, PAS.length - 1) / (PAS.length - 1)));
        s.querySelector(".fs-count b").textContent = String(done);
        const now = s.querySelector(".fs-now");
        now.innerHTML =
          done < PAS.length
            ? `<span>Maintenant</span>${PAS[done][1]}<button type="button" class="fs-go">Y aller <i>→</i></button>`
            : `<span>Bravo</span>Tu connais les bases de BOUSE. La suite, c’est toi qui choisis.`;
        if (animate) {
          now.removeAttribute("data-swap");
          void now.offsetWidth;
          now.dataset.swap = "";
        }
      }

      function fold(s) {
        const anim = s.animate(
          [
            { height: `${s.offsetHeight}px`, opacity: 1, marginBottom: getComputedStyle(s).marginBottom },
            { height: "0px", opacity: 0, marginBottom: "0px", paddingTop: "0px", paddingBottom: "0px", borderWidth: "0px" },
          ],
          { duration: 520, easing: "cubic-bezier(0.65,0,0.35,1)", fill: "forwards" },
        );
        anim.finished.then(() => s.remove());
      }

      function tick() {
        const s = ensureSteps();
        if (!s || done >= PAS.length) return;
        done += 1;
        paint(s, true);
        clearTimeout(timer);
        if (done === PAS.length) timer = setTimeout(() => fold(s), 2800);
      }

      frame.addEventListener("load", async () => {
        W = frame.contentWindow;
        D = frame.contentDocument;
        for (let i = 0; i < 80 && !D.querySelector(".learning-home"); i += 1) await wait(100);
        await wait(500);
        // L'appli redessine sa page quand on change d'espace : on repose la carte au retour.
        setInterval(() => {
          if (index < 0 && D.querySelector(".learning-home") && !D.querySelector(".first-steps") && done < PAS.length && !hiddenByUser) ensureSteps();
        }, 500);
        startTour();
      });

      document.getElementById("replay").onclick = () => {
        frame.contentWindow.location.hash = "#home";
        setTimeout(startTour, 250);
      };
      document.getElementById("tick").onclick = tick;
      document.getElementById("reset").onclick = () => {
        clearTimeout(timer);
        hiddenByUser = false;
        done = 0;
        D.querySelector(".first-steps")?.remove();
        ensureSteps();
      };
      for (const device of ["desktop", "phone"]) {
        document.getElementById(device).onclick = () => {
          stage.dataset.device = device;
          document.getElementById("desktop").setAttribute("aria-pressed", String(device === "desktop"));
          document.getElementById("phone").setAttribute("aria-pressed", String(device === "phone"));
          setTimeout(() => (index >= 0 ? place() : startTour()), 450);
        };
      }
    </script>
  </body>
</html>
